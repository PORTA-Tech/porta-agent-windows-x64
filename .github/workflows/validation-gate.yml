name: Validation Gate

on:
  push:
  pull_request:

jobs:
  validation-gate:
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      NUGET_XMLDOC_MODE: skip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/packages.lock.json

      - name: Build Solution (Single Node)
        shell: pwsh
        run: ./scripts/build.ps1 -Configuration Release

      - name: Run Validation Runner (Gate)
        shell: pwsh
        run: dotnet run --project src/Porta.Agent.ValidationRunner/Porta.Agent.ValidationRunner.csproj -c Release --no-build --nologo
