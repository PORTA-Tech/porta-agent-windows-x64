name: Validation Gate

on:
  push:
  pull_request:

jobs:
  validation-gate:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build Solution (Single Node)
        shell: pwsh
        run: ./scripts/build.ps1 -Configuration Release

      - name: Run Validation Runner (Gate)
        run: dotnet run --project src/Porta.Agent.ValidationRunner/Porta.Agent.ValidationRunner.csproj -c Release --no-build
