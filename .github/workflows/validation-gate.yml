name: Validation Gate

on:
  push:
  pull_request:

jobs:
  validation-gate:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build Solution (Single Node)
        shell: pwsh
        run: ./scripts/build.ps1 -Configuration Release

      - name: Run Validation Runner (Gate)
        run: dotnet run --project src/Porta.Agent.ValidationRunner/Porta.Agent.ValidationRunner.csproj -c Release --no-build

      # Maintenance item (a), 2026-08-12. Until this step existed, a green tick on this workflow
      # meant the solution COMPILED and nothing more: there was no `dotnet test` anywhere, so a
      # regression in any of the five suites reached main green. The four documented Core failures
      # (SECURITY_HANDOFF.md section 4.8) are allowed BY NAME, never by count.
      - name: Run Test Gate (five suites, four documented failures allowed by name)
        shell: pwsh
        run: ./scripts/test-gate.ps1 -Configuration Release

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: artifacts/test-results/*.trx
          if-no-files-found: warn
